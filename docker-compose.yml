version: '3.8'

services:
  # Service d'authentification
  crypto-analyzer-auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-analyzer-auth
    restart: unless-stopped
    ports:
      - "3006:3006"
    env_file:
      - .env.docker
    environment:
      - PORT=3006
    volumes:
      - auth-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:3006"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Volumes persistants
volumes:
  auth-logs:
    driver: local

networks:
  crypto_network:
    name: crypto_network
    external: true 